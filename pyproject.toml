[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "contoso-maf-workflow"
version = "0.1.0"
description = "Durable Microsoft Agent Framework research and presentation sample"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-core==1.21.0",
  "agent-framework-openai==1.14.4",
  "azure-identity>=1.21,<2",
  "azure-storage-blob>=12.25,<13",
  "fastapi>=0.115,<1",
  "filelock>=3.18,<4",
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3",
  "python-dotenv>=1,<2",
  "python-pptx>=1.0.2,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
contoso-agents = "contoso_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contoso_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
